<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chroniken von Elyndor</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <div>
    <h1>⚔️ Chroniken von Elyndor</h1>
    <span id="regionName">Grünes Tal</span>
  </div>

  <div class="playerStats">
    <span>Lv. <b id="level">1</b></span>
    <span>❤️ <b id="hp">100</b></span>
    <span>💰 <b id="gold">250</b></span>
  </div>
</header>

<main>

  <section class="gameArea">

    <canvas id="gameCanvas"></canvas>

    <div id="interactionBox" class="interaction hidden">
      <b id="interactionTitle"></b>
      <p id="interactionText"></p>
      <button id="interactionButton">Interagieren</button>
    </div>

    <div id="questNotification" class="notification hidden"></div>

    <div id="touchControls" class="touchControls">

      <div class="dpad">
        <button data-key="ArrowUp">▲</button>

        <div>
          <button data-key="ArrowLeft">◀</button>
          <button data-key="ArrowDown">▼</button>
          <button data-key="ArrowRight">▶</button>
        </div>
      </div>

      <button id="touchInteract" class="actionButton">E</button>
    </div>

  </section>

  <aside class="sidebar">

    <nav>
      <button class="tab active" data-tab="character">👤 Charakter</button>
      <button class="tab" data-tab="inventory">🎒 Inventar</button>
      <button class="tab" data-tab="equipment">⚔️ Ausrüstung</button>
      <button class="tab" data-tab="companions">🐺 Begleiter</button>
      <button class="tab" data-tab="quests">📜 Quests</button>
      <button class="tab" data-tab="mine">⛏️ Minen</button>
      <button class="tab" data-tab="auction">🏷️ Auktion</button>
    </nav>

    <div id="panel-character" class="panel active">

      <h2>Charakter</h2>

      <div id="classSelection">

        <p>Wähle deine Klasse:</p>

        <button class="classButton" data-class="Klingenmeister">
          ⚔️ Klingenmeister
        </button>

        <button class="classButton" data-class="Arkanist">
          🔮 Arkanist
        </button>

        <button class="classButton" data-class="Wächter">
          🛡️ Wächter
        </button>

        <button class="classButton" data-class="Naturhüter">
          🌿 Naturhüter
        </button>

      </div>

      <div id="characterInfo"></div>

    </div>

    <div id="panel-inventory" class="panel">
      <h2>🎒 Inventar</h2>
      <div id="inventory"></div>
    </div>

    <div id="panel-equipment" class="panel">
      <h2>⚔️ Ausrüstung</h2>
      <div id="equipment"></div>
    </div>

    <div id="panel-companions" class="panel">
      <h2>🐺 Begleiter</h2>
      <div id="companions"></div>
    </div>

    <div id="panel-quests" class="panel">
      <h2>📜 Quests</h2>
      <div id="quests"></div>
    </div>

    <div id="panel-mine" class="panel">
      <h2>⛏️ Minen</h2>
      <div id="mines"></div>
    </div>

    <div id="panel-auction" class="panel">
      <h2>🏷️ Auktionshaus</h2>
      <div id="auction"></div>
    </div>

  </aside>

</main>

<div id="dialog" class="dialog hidden">

  <div class="dialogBox">

    <h2 id="dialogName"></h2>

    <div id="dialogText"></div>

    <div id="dialogButtons"></div>

    <button id="dialogClose">Schließen</button>

  </div>

</div>

<div id="battle" class="battle hidden">

  <div class="battleHeader">
    <h2>⚔️ Kampf</h2>
    <span id="battleRound">Runde 1</span>
  </div>

  <div class="battleTeams">

    <div>
      <h3>Deine Begleiter</h3>
      <div id="playerTeam"></div>
    </div>

    <div>
      <h3>Gegner</h3>
      <div id="enemyTeam"></div>
    </div>

  </div>

  <div id="battleLog" class="battleLog"></div>

  <div id="battleActions"></div>

</div>

<script src="game.js"></script>

</body>
</html>
